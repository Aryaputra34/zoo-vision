# Zoo Vision on one park server. Run from this folder.
# Which services start is set by COMPOSE_PROFILES in .env (see .env.example):
#   always       postgres, redis, api-migrate, api, caddy
#   engine       mediamtx, zoo-ai-engine (needs an NVIDIA GPU)
#   web          the dashboard (Next.js), built from ${ZOO_WEB_DIR}
#   demo         demo-seed and demo-feed: fake cameras, users and history, no GPU needed (Phase 3 demo feeder)
# A park server sets COMPOSE_PROFILES=engine,web. A laptop without a GPU leaves it empty or uses demo.
# Never run a bare `docker compose up` on a laptop: name the services or set COMPOSE_PROFILES on purpose.
# Host data lives in ${ZOO_DATA_DIR} (default ./data): recordings, snapshots, models, logs. See README.md.
# The API and the engine share ${ZOO_DATA_DIR}/models. The engine has no config files: it reads its cameras
# from the API (API_URL, ENGINE_TOKEN) and reloads them live. Secrets come from .env.
# Container names are not fixed, so two stacks can share a server: COMPOSE_PROJECT_NAME prefixes them.
name: zoo-vision

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zoo_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: zoo_vision
      ZOO_API_DB_PASSWORD: ${ZOO_API_DB_PASSWORD:?set ZOO_API_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoo_owner -d zoo_vision"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      # The engine uses host networking, so Redis is published on the loopback only.
      # Set ZOO_REDIS_PORT when 6379 is taken by another Redis.
      - "127.0.0.1:${ZOO_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-shot: applies the Prisma migrations as the owner role, then exits.
  api-migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: zoo-vision-api:${ZOO_VERSION:-dev}
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      DATABASE_MIGRATE_URL: postgresql://zoo_owner:${POSTGRES_PASSWORD}@postgres:5432/zoo_vision
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: zoo-vision-api:${ZOO_VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://zoo_api:${ZOO_API_DB_PASSWORD}@postgres:5432/zoo_vision
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CAMERA_URL_KEY: ${CAMERA_URL_KEY:?set CAMERA_URL_KEY in .env}
      ENGINE_TOKEN: ${ENGINE_TOKEN:?set ENGINE_TOKEN in .env}
      COOKIE_SECURE: ${ZOO_COOKIE_SECURE:-true} # false only for plain http on a dev machine
      SWAGGER: ${ZOO_SWAGGER:-off} # off | superadmin | public
      MODELS_DIR: /data/models
      JOBS: "on" # offline check every 5 s; "off" on a second API replica
    volumes:
      - ${ZOO_DATA_DIR:-./data}/models:/data/models
    ports:
      # The loopback port is for the engine running from source and for debugging; Caddy reaches
      # the API on the compose network.
      - "127.0.0.1:${ZOO_API_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # The only service with public ports: /api, /media and /ws go to the API, /internal/* is a 404,
  # everything else goes to the dashboard. Inside the container Caddy listens on the same port numbers as
  # the host, so its http -> https redirect and the URLs it builds carry the right port.
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "${ZOO_HTTP_PORT:-80}:${ZOO_HTTP_PORT:-80}"
      - "${ZOO_HTTPS_PORT:-443}:${ZOO_HTTPS_PORT:-443}"
    environment:
      ZOO_HTTP_PORT: ${ZOO_HTTP_PORT:-80}
      ZOO_HTTPS_PORT: ${ZOO_HTTPS_PORT:-443}
      ZOO_SITE_ADDRESS: ${ZOO_SITE_ADDRESS:-localhost}
      ZOO_CADDY_MODE: ${ZOO_CADDY_MODE:-internal-tls} # dev | internal-tls | custom-tls
      ZOO_WEB_UPSTREAM: ${ZOO_WEB_UPSTREAM:-web:3000} # in development: host.docker.internal:3000
    volumes:
      - ./caddy:/etc/caddy:ro
      - ${ZOO_DATA_DIR:-./data}/certs:/certs:ro # custom-tls: cert.pem and key.pem
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy

  # The dashboard, built from a local checkout of the frontend (publishing images is Phase 5).
  web:
    profiles: ["web"]
    build: ${ZOO_WEB_DIR:-../../zoo-vision-fe}
    image: zoo-vision-web:${ZOO_VERSION:-dev}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Pulls every camera once, records it (mediamtx.yml), re-serves RTSP to the AI engine
  # and serves event clips to the dashboard on :9996.
  mediamtx:
    profiles: ["engine"]
    image: bluenviron/mediamtx:1.21.1
    restart: unless-stopped
    network_mode: "host"
    environment:
      - MTX_PATHDEFAULTS_RECORDPATH=/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ${ZOO_DATA_DIR:-./data}/recordings:/recordings

  zoo-ai-engine:
    profiles: ["engine"]
    build: ../services/engine
    image: zoo-vision-engine:${ZOO_VERSION:-dev}
    restart: unless-stopped
    network_mode: "host" # Host networking for lowest latency RTSP & REST calls
    depends_on:
      - mediamtx
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # Passes your RTX 3060 / 4070 GPU directly inside
              capabilities: [ gpu, video ] # Enables CUDA + NVDEC hardware video decoding
    volumes:
      - ${ZOO_DATA_DIR:-./data}/models:/app/models # Same host folder as the API; read-write for ONNX conversions
      - ${ZOO_DATA_DIR:-./data}/logs:/app/logs
      - ${ZOO_DATA_DIR:-./data}/snapshots:/app/snapshots # Event JPEGs served to the dashboard
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://:${REDIS_PASSWORD}@127.0.0.1:${ZOO_REDIS_PORT:-6379}/0
      - ENGINE_GROUP=default
      - API_URL=http://127.0.0.1:${ZOO_API_PORT:-3001} # host networking: the API is published on the loopback
      - ENGINE_TOKEN=${ENGINE_TOKEN:?set ENGINE_TOKEN in .env}
      - DEVICE=cuda:0
      - ZOO_MODELS_DIR=/app/models
      - SNAPSHOT_DIR=/app/snapshots

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
