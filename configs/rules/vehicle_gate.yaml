# Vehicle Gate Counter & Indonesian LPR Rule Configuration
rule_name: "vehicle_gate_audit"

# Model Architecture (yolo11s.onnx, yolo26s.onnx, yolo26m.onnx)
model_name: "yolo26l.onnx"
imgsz: 640          # 16:9 Widescreen CCTV (Height 736, Width 1280 - zero letterbox padding)

# BEST IS yolo26l.pt/onnx imgz=640

# Virtual Tripwire across the speed bump / gate (normalized 0.0 - 1.0)
# Start on right curb, End on far left road edge
tripwire:
  start: [0.760, 0.580]
  end: [0.050, 0.430]

# Direction vectors: vehicles moving downwards on screen trigger ENTRY
entry_direction: "down"

# Roadway Region of Interest (ROI) polygon
# Filters out false positives on building walls, posts, and distant background
roi_polygon:
  - [0.00, 0.15]
  - [0.83, 0.15]
  - [0.80, 1.00]
  - [0.00, 1.00]

# ByteTrack tracker tuning for barrier/gate stop-and-go
track_activation_thresh: 0.25
lost_track_buffer: 75       # 5 seconds memory at 15 FPS (prevents ID loss when stopped)
matching_thresh: 0.70       # Resilient IoU matching through turns and angles
frame_rate: 15              # Matched to camera FPS for accurate Kalman velocity

# Recognized vehicle classes from COCO
vehicle_classes:
  - "car"
  - "motorcycle"
  - "bus"
  - "truck"

confidence_threshold: 0.30

# Indonesian Plate Recognition
anpr:
  enabled: true
  model_path: "models/license_plate_detector.onnx"
  regex_pattern: '^[A-Z]{1,2}\s?\d{1,4}\s?[A-Z0-9]{1,3}$'
  min_plate_confidence: 0.25

# Nx Meta Event Metadata
nx_bookmark:
  tag: "#vehicle_audit"
  title: "[GATE AUDIT] Vehicle Entry Logged"
  duration_ms: 10000
