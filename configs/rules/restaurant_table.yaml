# Restaurant Table Occupancy & Dwell Time Rule Configuration
rule_name: "restaurant_table_monitor"

# Model Architecture
model_name: "yolo11s.onnx"
imgsz: 1920
confidence_threshold: 0.20
target_class: "person"

# Anti-Duplicate suppression
deduplication_enabled: true
iou_threshold: 0.45
containment_threshold: 0.65

# Display & Presentation
show_person_boxes: false        # Draw bounding boxes on detected patrons
show_person_labels: false       # Draw confidence labels
show_overlay: true              # Draw table polygon outlines and translucent highlights
show_labels: true               # Draw table badges (e.g. "Table 1: OCCUPIED (12m 30s)")
show_summary_card: true         # Draw summary card at top-right

# Global Dwell Time & Hysteresis Settings
dwell_time:
  enabled: false                # Toggle: true = track dwell time; false = simple Occupied/Vacant
  min_occupied_sec: 0.0         # Immediate occupancy confirmation upon person detection
  empty_debounce_sec: 15.0      # Table must be empty for 15s continuously before marking VACANT
  alert_dwell_sec: 3600.0       # Alert if table exceeds 60 minutes dwell time

# Predefined Table ROIs (normalized coordinates [x, y] 0.0 to 1.0)
# Calibrated for Safari Cafe dining hall layout
