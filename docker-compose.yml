version: '3.8'

services:
  # Pulls every camera once, records it (configs/mediamtx.yml), re-serves RTSP to the AI engine
  # and serves event clips to the dashboard on :9996.
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    container_name: zoo_mediamtx
    restart: unless-stopped
    network_mode: "host"
    environment:
      - MTX_PATHDEFAULTS_RECORDPATH=/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    volumes:
      - ./configs/mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings

  zoo-ai-engine:
    build: .
    container_name: zoo_vision_service
    restart: unless-stopped
    network_mode: "host" # Host networking for lowest latency RTSP & REST calls
    depends_on:
      - mediamtx
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # Passes your RTX 3060 / 4070 GPU directly inside
              capabilities: [ gpu, video ] # Enables CUDA + NVDEC hardware video decoding
    volumes:
      - ./configs:/app/configs # Edit camera configs without rebuilding image
      - ./models:/app/models # Hot-swap new TensorRT .engine files anytime
      - ./logs:/app/logs
      - ./snapshots:/app/snapshots # Event JPEGs served to the dashboard
    environment:
      - PYTHONUNBUFFERED=1
