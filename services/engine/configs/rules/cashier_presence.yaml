# Cashier Presence & Customer Service Rule Configuration
rule_name: "cashier_presence_monitor"
model_name: "yolo11s.pt"

# Detection parameters
confidence_threshold: 0.22
target_class: "person"        # COCO class 0

# Dual Zone Configuration (Normalized 0.0 - 1.0 coordinates)
# 1. Clerk Desk Zone: Covers cashier chair & behind-the-counter desk area
clerk_zone:
  - [0.33, 0.46]
  - [0.72, 0.46]
  - [0.72, 1.00]
  - [0.33, 1.00]

# 2. Visitor Queue Zone: Covers customer queuing area in front of ticket window (filtered from background street depth)
visitor_zone:
  - [0.36, 0.12]
  - [0.64, 0.12]
  - [0.64, 0.46]
  - [0.36, 0.46]

# Alerting thresholds
absence_alert_timeout_sec: 10         # Seconds of continuous absence before triggering unattended alert
min_waiting_confirm_sec: 3            # Minimum continuous seconds in queue zone before declaring customer waiting (filters passerby)
visitor_waiting_alert_timeout_sec: 5  # Seconds of customer waiting while desk is empty before urgent alert
debounce_alert_sec: 30                # Minimum seconds between repeated alerts

# Nx Meta Event & Bookmark Metadata
nx_bookmark:
  tag: "#cashier_unattended"
  title: "[STAFF ALERT] Cashier Desk Unattended"
  duration_ms: 10000
